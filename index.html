<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>JARVIS Motion Lab — Stage 1</title>
<style>
  html, body { margin:0; padding:0; overflow:hidden; background:#0a0a0f; height:100%; }
  #status {
    position:fixed; top:0; left:0; right:0; z-index:10;
    color:#00e5ff; font-family:monospace; font-size:13px;
    background:rgba(0,0,0,0.6); padding:8px 10px;
  }
</style>
</head>
<body>
<div id="status">Booting…</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js"
  }
}
</script>

<script type="module">
  const statusEl = document.getElementById('status');
  const log = (msg) => { statusEl.textContent = msg; console.log(msg); };

  try {
    const THREE = await import('three');

    log('THREE loaded. Setting up scene…');

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x0a0a0f);

    const camera = new THREE.PerspectiveCamera(
      50, window.innerWidth / window.innerHeight, 0.1, 100
    );
    camera.position.set(0, 1, 3);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2)); // mobile-friendly cap
    renderer.setSize(window.innerWidth, window.innerHeight);
    document.body.appendChild(renderer.domElement);

    const light = new THREE.DirectionalLight(0xffffff, 2);
    light.position.set(2, 3, 2);
    scene.add(light);
    scene.add(new THREE.AmbientLight(0x404040, 1.5));

    const geometry = new THREE.BoxGeometry(1, 1, 1);
    const material = new THREE.MeshStandardMaterial({ color: 0x00e5ff });
    const cube = new THREE.Mesh(geometry, material);
    scene.add(cube);

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    function animate() {
      requestAnimationFrame(animate);
      cube.rotation.x += 0.01;
      cube.rotation.y += 0.015;
      renderer.render(scene, camera);
    }
    animate();

    log('STAGE 1 OK — renderer + cube running.');
  } catch (err) {
    log('STAGE 1 ERROR: ' + err.message);
    console.error(err);
  }
</script>
</body>
</html>
