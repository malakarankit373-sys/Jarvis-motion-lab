<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jarvis Motion Lab</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      overflow: hidden;
      background: #080b12;
      color: white;
      font-family: Arial, sans-serif;
    }

    #ui {
      position: fixed;
      z-index: 10;
      top: 15px;
      left: 15px;
      right: 15px;
      padding: 15px;
      border-radius: 16px;
      background: rgba(10, 15, 25, 0.9);
      backdrop-filter: blur(10px);
    }

    h2 {
      margin: 0 0 12px;
      font-size: 20px;
    }

    input {
      width: 100%;
      margin: 6px 0;
      padding: 10px;
      border-radius: 10px;
      background: #151c29;
      color: white;
      border: 1px solid #303b50;
    }

    button {
      margin-top: 8px;
      padding: 10px 14px;
      border: 0;
      border-radius: 10px;
      font-weight: bold;
    }

    #status {
      margin-top: 10px;
      font-size: 13px;
      opacity: 0.8;
    }

    canvas {
      display: block;
      width: 100vw;
      height: 100vh;
      touch-action: none;
    }
  </style>
</head>

<body>

<div id="ui">
  <h2>🤖 JARVIS Motion Lab</h2>

  <input id="vrmInput" type="file" accept=".vrm">

  <input id="fbxInput" type="file" accept=".fbx">

  <button id="playBtn">▶ Play</button>
  <button id="resetBtn">↻ Reset</button>

  <div id="status">Load your VRM first.</div>
</div>

<script type="module">

import * as THREE from
  "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js";

import { OrbitControls } from
  "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/controls/OrbitControls.js";

import { FBXLoader } from
  "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/loaders/FBXLoader.js";

import {
  VRMLoaderPlugin,
  VRMUtils
} from
  "https://cdn.jsdelivr.net/npm/@pixiv/three-vrm@3.5.5/+esm";

import { GLTFLoader } from
  "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/loaders/GLTFLoader.js";


/* --------------------------------
   Scene
-------------------------------- */

const scene = new THREE.Scene();

scene.background = new THREE.Color(0x080b12);


/* Camera */

const camera = new THREE.PerspectiveCamera(
  35,
  window.innerWidth / window.innerHeight,
  0.1,
  100
);

camera.position.set(0, 1.4, 3);


/* Renderer */

const renderer = new THREE.WebGLRenderer({
  antialias: true,
  alpha: true
});

renderer.setPixelRatio(
  Math.min(window.devicePixelRatio, 2)
);

renderer.setSize(
  window.innerWidth,
  window.innerHeight
);

renderer.outputColorSpace = THREE.SRGBColorSpace;

document.body.appendChild(renderer.domElement);


/* Lights */

const hemiLight = new THREE.HemisphereLight(
  0xffffff,
  0x222233,
  2
);

scene.add(hemiLight);

const directionalLight = new THREE.DirectionalLight(
  0xffffff,
  2
);

directionalLight.position.set(2, 3, 2);

scene.add(directionalLight);


/* Controls */

const controls = new OrbitControls(
  camera,
  renderer.domElement
);

controls.enableDamping = true;

controls.target.set(0, 1.2, 0);

controls.enablePan = false;


/* Loaders */

const gltfLoader = new GLTFLoader();

const fbxLoader = new FBXLoader();


/* VRM */

let currentVRM = null;

let mixer = null;

let currentAction = null;

let animationPlaying = false;


/* Status */

const status = document.getElementById("status");

function setStatus(text) {
  status.textContent = text;
}


/* --------------------------------
   Load VRM
-------------------------------- */

document
  .getElementById("vrmInput")
  .addEventListener("change", async event => {

    const file = event.target.files[0];

    if (!file) return;

    setStatus("Loading VRM...");

    try {

      const url = URL.createObjectURL(file);

      gltfLoader.register(parser =>
        new VRMLoaderPlugin(parser)
      );

      const gltf = await gltfLoader.loadAsync(url);

      const vrm = gltf.userData.vrm;

      if (!vrm) {
        throw new Error("VRM data not found.");
      }

      if (currentVRM) {

        VRMUtils.deepDispose(currentVRM.scene);

        scene.remove(currentVRM.scene);

      }

      currentVRM = vrm;

      scene.add(vrm.scene);

      vrm.scene.rotation.y = Math.PI;

      setStatus(
        "✅ VRM loaded. Now choose your FBX animation."
      );

    } catch (error) {

      console.error(error);

      setStatus(
        "❌ VRM failed to load: " + error.message
      );

    }

  });


/* --------------------------------
   Load FBX
-------------------------------- */

document
  .getElementById("fbxInput")
  .addEventListener("change", async event => {

    const file = event.target.files[0];

    if (!file) return;

    if (!currentVRM) {

      setStatus(
        "⚠️ Load the VRM first."
      );

      return;

    }

    setStatus(
      "Loading FBX animation..."
    );

    try {

      const url = URL.createObjectURL(file);

      const fbx = await fbxLoader.loadAsync(url);

      console.log(
        "FBX:",
        fbx
      );

      if (!fbx.animations ||
          fbx.animations.length === 0) {

        throw new Error(
          "No animation was found inside this FBX."
        );

      }

      /*
        TEMPORARY TEST:

        We first load the FBX and inspect
        its animation tracks.

        The actual Mixamo → VRM retargeting
        is added after confirming the FBX
        loads correctly.
      */

      mixer = new THREE.AnimationMixer(
        currentVRM.scene
      );

      setStatus(
        "✅ FBX loaded. Animation found: " +
        fbx.animations.length +
        " clip(s)."
      );

      console.log(
        "Animation clips:",
        fbx.animations
      );

    } catch (error) {

      console.error(error);

      setStatus(
        "❌ FBX failed: " +
        error.message
      );

    }

  });


/* --------------------------------
   Play
-------------------------------- */

document
  .getElementById("playBtn")
  .addEventListener("click", () => {

    if (!mixer) {

      setStatus(
        "Load the VRM and FBX first."
      );

      return;

    }

    if (!currentAction) {

      setStatus(
        "FBX loaded successfully. Retargeting is next."
      );

      return;

    }

    animationPlaying = !animationPlaying;

    if (animationPlaying) {

      currentAction.play();

      document.getElementById(
        "playBtn"
      ).textContent = "⏸ Pause";

    } else {

      currentAction.paused = true;

      document.getElementById(
        "playBtn"
      ).textContent = "▶ Play";

    }

  });


/* --------------------------------
   Reset
-------------------------------- */

document
  .getElementById("resetBtn")
  .addEventListener("click", () => {

    if (!currentVRM) return;

    currentVRM.scene.position.set(
      0, 0, 0
    );

    currentVRM.scene.rotation.set(
      0, Math.PI, 0
    );

    camera.position.set(
      0, 1.4, 3
    );

    controls.target.set(
      0, 1.2, 0
    );

    controls.update();

  });


/* --------------------------------
   Animation loop
-------------------------------- */

const clock = new THREE.Clock();

function animate() {

  requestAnimationFrame(
    animate
  );

  const delta =
    clock.getDelta();

  if (mixer &&
      animationPlaying) {

    mixer.update(delta);

  }

  if (currentVRM) {

    currentVRM.update(delta);

  }

  controls.update();

  renderer.render(
    scene,
    camera
  );

}

animate();


/* --------------------------------
   Resize
-------------------------------- */

window.addEventListener(
  "resize",
  () => {

    camera.aspect =
      window.innerWidth /
      window.innerHeight;

    camera.updateProjectionMatrix();

    renderer.setSize(
      window.innerWidth,
      window.innerHeight
    );

  }
);

</script>

</body>
  </html>
